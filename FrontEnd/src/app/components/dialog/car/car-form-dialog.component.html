<div class="dialog-container car-dialog">
  <h2 mat-dialog-title>{{ dialogTitle }}</h2>
  
  <form [formGroup]="carForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
      <div class="form-field">
        <label for="model">Car Model</label>
        <input type="text" id="model" formControlName="model" placeholder="Enter car model">
        <div class="error-message" *ngIf="carForm.get('model')?.invalid && carForm.get('model')?.touched">
          Car model is required
        </div>
      </div>
      
      <div class="form-field">
        <label for="year">Year</label>
        <input type="number" id="year" formControlName="year" placeholder="Enter year">
        <div class="error-message" *ngIf="carForm.get('year')?.invalid && carForm.get('year')?.touched">
          Please enter a valid year
        </div>
      </div>
      
      <div class="form-field">
        <label for="registration">Registration</label>
        <input type="text" id="registration" formControlName="registration" placeholder="Enter registration number">
      </div>
      
      <div class="form-field">
        <label for="brandId">Brand</label>
        <select id="brandId" formControlName="brandId">
          <option value="" disabled>Select a brand</option>
          <option *ngFor="let brand of brands" [value]="brand.id">{{ brand.name }}</option>
        </select>
        <div class="error-message" *ngIf="carForm.get('brandId')?.invalid && carForm.get('brandId')?.touched">
          Brand is required
        </div>
      </div>
    </div>
    
    <div mat-dialog-actions>
      <button type="button" (click)="onCancel()">Cancel</button>
      <button type="submit" [disabled]="carForm.invalid">Save</button>
    </div>
  </form>
</div>
