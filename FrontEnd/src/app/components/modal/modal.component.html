<div class="modal-backdrop" (click)="onCancel()"></div>
<div class="alert-box">
  <!-- Header -->
  <div class="modal-header">
    <h2 mat-dialog-title>{{ title }}</h2>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <p>{{ message }}</p>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <!-- Buttons for Confirm Modal -->
    <ng-container *ngIf="type === 'confirm'">
      <button class="btn btn-default" style="width: 60px;height: 40px;" (click)="onCancel()">
        <mat-icon class="icon-small">cancel</mat-icon> 
      </button>
      <button class="btn btn-primary" style="background-color: #6fa87e" style="width: 60px;height: 40px;" (click)="onConfirm()">
        <mat-icon class="icon-small" >check_circle</mat-icon> 
      </button>
    </ng-container>

    <!-- Buttons for Error Modal -->
    <ng-container *ngIf="type === 'error'">
      <button class="btn btn-default" style="background-color: #ad6b6b; width: 60px;height: 40px;" (click)="onClose()">
        <mat-icon class="icon-small">close</mat-icon> 
      </button>
    </ng-container>
  </div>
</div>
